[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editing-automation-engine"
version = "0.1.0"
description = "Cross-platform, non-destructive video editing preparation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "VEA contributors" }]
dependencies = []

[project.optional-dependencies]
macos = [
    "faster-whisper==1.2.1",
    "av>=11,<19",
]
windows-cpu = [
    "faster-whisper==1.2.1",
    "av>=11,<19",
]
windows = [
    "faster-whisper==1.2.1",
    "av>=11,<19",
    # CTranslate2 loads CUDA libraries from PATH on Windows. Keep a local,
    # project-venv CUDA 12 runtime so GPU inference works without a global Toolkit.
    "nvidia-cublas-cu12==12.9.1.4",
    "nvidia-cuda-runtime-cu12==12.9.79",
]
dev = ["pytest==8.4.2"]

[project.scripts]
vea = "vea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
