name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install lightweight validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install media engine without optional backends
        run: python -m pip install --disable-pip-version-check --no-deps -e ./engine
      - name: Validate contract schemas and fixtures
        run: python tools/validate_contracts.py
      - name: Run Python tests
        run: python -m unittest discover -s packages/python/tests -v
      - name: Run migrated media engine tests
        run: python -m pytest engine/tests -q
      - name: Run JavaScript tests
        run: npm test
      - name: Check documentation links
        run: python tools/check_docs.py
      - name: Check public repository hygiene
        run: python tools/check_public_hygiene.py
      - name: Check policy integrity
        run: python tools/check_policy_integrity.py
